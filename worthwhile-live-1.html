<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worthwhile (working title)</title>
<style>

:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#14213D; --muted:#566074; --line:#D5DACD;
  --accent:#F2B632; --accent-ink:#14213D; --focus:#2B59C3;
  --c-learn:#2B59C3; --c-inspire:#8A5A00; --c-news:#B8432B; --c-skills:#1F7A5C; --c-laughs:#7A4FB5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1626; --surface:#17213A; --ink:#EEF1F8; --muted:#A3AEC6; --line:#2A3757;
    --accent:#F2B632; --accent-ink:#14213D; --focus:#8FB0FF;
    --c-learn:#8FB0FF; --c-inspire:#F2B632; --c-news:#F29A82; --c-skills:#63CBA6; --c-laughs:#BFA3EE;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{max-width:520px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.brand h1{font-size:24px;letter-spacing:-.01em}
.tag{margin:0;color:var(--muted);font-size:14px}
main{max-width:520px;margin:0 auto;padding:0 0 96px;min-height:70vh}
main:focus{outline:none}
.pad{padding:8px 16px}
.lead{font-size:15px;color:var(--muted);margin:6px 0 16px}

/* Feed posts: full-width, separated by rules, not rounded cards */
.post{border-top:1px solid var(--line);padding:18px 0 6px}
.post:first-child{border-top:0}
.media{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#000}
.textcard{width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 20px}
.textcard h3{font-size:clamp(28px,8vw,40px);letter-spacing:-.015em}
.textcard small{display:block;margin-bottom:10px;font-size:14px;opacity:.9}
.cat-learn{background:#1E3F8F;color:#fff}
.cat-inspire{background:#F2B632;color:#14213D}
.cat-news{background:#8F2F1B;color:#fff}
.cat-skills{background:#17614A;color:#fff}
.cat-laughs{background:#5E3A96;color:#fff}
.artcard{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#1E3F8F}
.artcard svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.artcard .cap{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 20px;color:#fff;background:linear-gradient(to top,rgba(10,15,30,.88),rgba(10,15,30,0))}
.artcard .cap small{display:block;margin-bottom:8px;font-size:14px;opacity:.92}
.artcard .cap h3{font-size:clamp(28px,8vw,40px);letter-spacing:-.015em}
.meta{padding:12px 16px 0}
.catlabel{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.catlabel i{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.t-learn{color:var(--c-learn)} .t-inspire{color:var(--c-inspire)} .t-news{color:var(--c-news)} .t-skills{color:var(--c-skills)} .t-laughs{color:var(--c-laughs)}
.meta h3{font-size:21px;margin:6px 0 6px}
.meta p{margin:0 0 8px}
.source{font-size:14px;word-break:break-all}
.source a{color:var(--focus)}
.why{font-size:13px;color:var(--muted);margin:6px 0 12px}
.sample{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:8px;color:var(--muted);font-weight:400}
.actions{display:flex;gap:10px;padding:0 16px 14px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:99px;padding:10px 18px;cursor:pointer;font-weight:600;min-height:44px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.count{font-weight:400;opacity:.8;margin-left:6px}
.actions.icons{padding:0 8px 14px;gap:2px;align-items:center}
.actions .sp{flex:1}
.ib{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 10px;min-width:44px;min-height:44px;cursor:pointer;color:var(--ink);border-radius:12px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.ib:active{transform:scale(.94)}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib.like[aria-pressed="true"]{color:#E0405A}
.ib.like[aria-pressed="true"] .ic{fill:currentColor}
.ib.help[aria-pressed="true"] .ic{fill:var(--accent)}
.ib.save[aria-pressed="true"] .ic{fill:currentColor}

/* End of feed */
.caught{margin:8px 16px 0;padding:36px 20px;border:2px solid var(--ink);border-radius:18px;text-align:center}
.caught h2{font-size:28px;margin-bottom:8px}
.caught p{margin:0 auto 18px;max-width:30ch;color:var(--muted)}

/* Onboarding + forms */
.chips{display:grid;gap:10px;margin:8px 0 22px}
.chip{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;width:100%}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip b{display:block;font-size:17px}
.chip span{font-size:14px;color:var(--muted)}
.dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:5px}
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-weight:600;margin-bottom:6px}
.field small{display:block;color:var(--muted);margin-top:4px;font-size:13px}
input[type=text],input[type=url],select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:96px;resize:vertical}
.err{color:var(--c-news);font-weight:600;margin:0 0 12px}

/* Dials */
.dial{margin:0 0 16px}
.dial label{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-bottom:2px}
.dial output{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.dial small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.group{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.group h2{font-size:20px;margin-bottom:10px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .n{width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .tt{flex:1;min-width:0}
.rank .tt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .tt span{font-size:12px;color:var(--muted)}
.rank .sc{font-variant-numeric:tabular-nums;font-weight:600}
.rank .btn{padding:6px 12px;min-height:36px;font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;background:none;border:0;padding:14px 6px;font-weight:600;color:var(--muted);cursor:pointer;min-height:56px;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}.btn:active{transform:none}}

input[type=email],input[type=password]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.seg{display:flex;gap:8px;margin:12px 0 18px}
.seg button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:10px;font-weight:600;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.comments{padding:0 16px 12px}
.comments p{margin:0 0 8px;font-size:15px}
.comments .none{color:var(--muted);font-size:14px}
.cform{display:flex;gap:8px;margin-top:8px}
.cform input{flex:1;min-width:0}
.linkrow{display:flex;gap:18px;padding:0 16px 14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:6px 0;min-height:32px}
.notice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;margin:0 0 14px;font-size:14px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
nav.tabs button{font-size:14px;padding:14px 2px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }
function ago(t){ const s=(Date.now()-new Date(t))/1000; if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; }

if(!window.supabase){
  $('#app').innerHTML = '<div class="pad"><p class="err">Could not load the Supabase library. Check your internet connection and reload.</p></div>';
  throw new Error('supabase-js not loaded');
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- STATE ---------- */
let user = null, profile = null, posts = [], dials = JSON.parse(JSON.stringify(DEFAULT_DIALS));
let mine = {like:new Set(), helped:new Set(), save:new Set()};
let order = [], view = 'feed', msg = '', authMode = 'login', tmpInterests = [];
let comments = {}, openC = new Set();
let banReason = '', reportsList = [];

/* ---------- DATA ---------- */
async function loadProfile(){
  const {data} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  profile = data || null;
}
async function loadSettings(){
  const {data} = await sb.from('settings').select('dials').eq('id',1).maybeSingle();
  if(data && data.dials) dials = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DIALS)), data.dials, {boost:Object.assign({}, DEFAULT_DIALS.boost, data.dials.boost||{})});
}
async function loadPosts(){
  const {data, error} = await sb.from('post_feed').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){ toast('Could not load posts'); return; }
  posts = data || [];
}
async function loadMine(){
  mine = {like:new Set(), helped:new Set(), save:new Set()};
  const {data} = await sb.from('reactions').select('post_id,kind');
  (data || []).forEach(r => { if(mine[r.kind]) mine[r.kind].add(r.post_id); });
}
async function handleSession(session){
  user = session ? session.user : null;
  profile = null;
  if(user){
    await Promise.all([loadProfile(), loadSettings(), loadPosts(), loadMine()]);
    if(profile && profile.banned){
      const {data} = await sb.from('bans').select('reason').eq('user_id', user.id).maybeSingle();
      banReason = data ? data.reason : '';
    }
  }
  show();
}
sb.auth.onAuthStateChange((event, session) => {
  if(!['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(event)) return;
  if(event === 'SIGNED_IN' && user && session && session.user.id === user.id) return;
  setTimeout(() => handleSession(session), 0);
});

/* ---------- THE ALGORITHM ---------- */
function score(p){
  const d = dials;
  const interests = (profile && profile.interests) || [];
  const match = interests.includes(p.category) ? 1 : 0.25;
  const recency = Math.exp(-((Date.now() - new Date(p.created_at)) / 36e5) / 72);
  const value = Math.min(1, (p.helped*2 + p.saves) / 40);
  const pop = Math.min(1, p.likes / 50);
  return (d.topic/100)*match*3 + (d.recency/100)*recency*2 + (d.value/100)*value*2
       + (d.popularity/100)*pop + ((d.boost[p.category]||0)/100)*2 + (p.boosted ? 1.5 : 0);
}
function computeOrder(){
  const sorted = posts.map(p => ({p, s:score(p)})).sort((a,b) => b.s - a.s);
  const limit = Math.floor(FEED_SIZE * dials.humorCap / 100);
  let laughs = 0; const out = [];
  for(const {p} of sorted){
    if(out.length >= FEED_SIZE) break;
    if(p.category === 'laughs'){ if(laughs >= limit) continue; laughs++; }
    out.push(p.id);
  }
  return out;
}
function why(p){
  const interests = (profile && profile.interests) || [];
  if(p.boosted) return 'Picked by the Worthwhile team';
  if(interests.includes(p.category)) return 'You asked for more ' + CATS[p.category].name;
  if((dials.boost[p.category]||0) > 0) return 'A topic we are featuring';
  return 'Helpful to many people';
}

async function doAuth(){
  const email = $('#a-email').value.trim(), pass = $('#a-pass').value;
  if(!email || !pass){ msg = 'Enter your email and password.'; renderAuth(); return; }
  if(authMode === 'login'){
    const {error} = await sb.auth.signInWithPassword({email, password:pass});
    if(error){ msg = error.message; renderAuth(); }
  } else {
    const username = $('#a-user').value.trim();
    if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){ msg = 'Username must be 3 to 20 letters, numbers or underscores.'; renderAuth(); return; }
    if(pass.length < 6){ msg = 'Password must be at least 6 characters.'; renderAuth(); return; }
    const {data, error} = await sb.auth.signUp({email, password:pass, options:{data:{username}}});
    if(error){ msg = error.message; renderAuth(); }
    else if(!data.session){ authMode = 'login'; msg = 'ok:Account created. Check your email to confirm it, then log in.'; renderAuth(); }
  }
}
async function toggleReaction(kind, id){
  const p = posts.find(x => x.id === id); if(!p) return;
  const field = {like:'likes', helped:'helped', save:'saves'}[kind];
  const was = mine[kind].has(id);
  if(was){ mine[kind].delete(id); p[field]--; } else { mine[kind].add(id); p[field]++; }
  view === 'saved' ? renderSaved() : renderFeed();
  const q = was ? sb.from('reactions').delete().match({user_id:user.id, post_id:id, kind})
                : sb.from('reactions').insert({user_id:user.id, post_id:id, kind});
  const {error} = await q;
  if(error){
    if(was){ mine[kind].add(id); p[field]++; } else { mine[kind].delete(id); p[field]--; }
    view === 'saved' ? renderSaved() : renderFeed();
    toast('Could not save that. Try again.');
  } else if(kind === 'save'){ toast(was ? 'Removed from saved' : 'Saved'); }
}
async function toggleComments(id){
  if(openC.has(id)){ openC.delete(id); view === 'saved' ? renderSaved() : renderFeed(); return; }
  openC.add(id); view === 'saved' ? renderSaved() : renderFeed();
  const {data, error} = await sb.from('comments').select('id,body,created_at,user_id,profiles(username)').eq('post_id', id).order('created_at');
  comments[id] = error ? [] : data;
  view === 'saved' ? renderSaved() : renderFeed();
}
async function addComment(id){
  const input = document.getElementById('ci-'+id); const body = input.value.trim(); if(!body) return;
  const {data, error} = await sb.from('comments').insert({post_id:id, user_id:user.id, body}).select('id,body,created_at,user_id,profiles(username)').single();
  if(error){ toast('Could not post your comment'); return; }
  (comments[id] = comments[id] || []).push(data);
  posts.find(p => p.id === id).comments++;
  view === 'saved' ? renderSaved() : renderFeed();
}
async function sharePost(p){
  if(!p) return;
  const text = p.title + ': ' + p.body;
  const data = {title:p.title, text};
  if(/^https?:/.test(location.href)) data.url = location.href;
  try{ if(navigator.share){ await navigator.share(data); return; } }
  catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text + (data.url ? ' ' + data.url : '')); toast('Copied, ready to paste'); }
  catch(e){ toast('Sharing is not available here'); }
}
async function reportPost(id){
  const reason = prompt('Why are you reporting this post? (for example: false information, harmful, spam)');
  if(!reason || !reason.trim()) return;
  const {error} = await sb.from('reports').insert({post_id:id, user_id:user.id, reason:reason.trim().slice(0,300)});
  toast(error ? 'Could not send your report' : 'Report sent. Thank you.');
}
async function deletePost(id){
  if(!confirm('Delete this post? This cannot be undone.')) return;
  const {error} = await sb.from('posts').delete().eq('id', id);
  if(error){ toast('Could not delete the post'); return; }
  posts = posts.filter(p => p.id !== id); order = order.filter(x => x !== id);
  toast('Deleted'); view === 'saved' ? renderSaved() : renderFeed();
}
async function publish(){
  const title = $('#f-title').value.trim(), body = $('#f-body').value.trim();
  const category = $('#f-cat').value, source = $('#f-source').value.trim();
  const file = $('#f-file').files[0];
  const fail = m => { msg = m; renderPost(); };
  if(!title) return fail('Add a title.');
  if(!body) return fail('Say what people will take away.');
  if(source && !/^https?:\/\//.test(source)) return fail('The source link must start with http:// or https://');
  if(category === 'news' && !source) return fail('News posts need a source link.');
  if(file && file.size > MAX_MB*1024*1024) return fail('That file is too large. The limit is ' + MAX_MB + ' MB.');
  const btn = $('#publishBtn'); btn.disabled = true; btn.textContent = 'Publishing\u2026';
  let media_url = null, media_type = null;
  if(file){
    const ext = ((file.name.split('.').pop() || 'bin').toLowerCase()).replace(/[^a-z0-9]/g,'').slice(0,5) || 'bin';
    const path = `${user.id}/${Date.now()}.${ext}`;
    const up = await sb.storage.from('media').upload(path, file, {contentType:file.type});
    if(up.error){ return fail('Upload failed: ' + up.error.message); }
    media_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    media_type = file.type.startsWith('video') ? 'video' : 'image';
  }
  const {error} = await sb.from('posts').insert({user_id:user.id, category, title, body, source_url:source || null, media_url, media_type});
  if(error) return fail('Could not publish: ' + error.message);
  await loadPosts(); msg = ''; toast('Published'); show('feed');
}

  if(nav){ show(nav.dataset.view); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;

  if(act === 'mode'){ authMode = id; msg = ''; renderAuth(); }
  else if(act === 'auth') await doAuth();
  else if(act === 'signout'){ await sb.auth.signOut(); }
  else if(act === 'interest'){
    const i = tmpInterests.indexOf(id);
    if(i >= 0) tmpInterests.splice(i,1); else tmpInterests.push(id);
    renderInterests(!profile.interests.length);
  }
  else if(act === 'editInterests'){ tmpInterests = [...profile.interests]; renderInterests(false); }
  else if(act === 'saveInterests'){
    const {error} = await sb.from('profiles').update({interests:tmpInterests}).eq('id', user.id);
    if(error){ toast('Could not save your interests'); return; }
    profile.interests = [...tmpInterests]; toast('Saved'); show('feed');
  }
  else if(act === 'like' || act === 'helped' || act === 'save') await toggleReaction(act, id);
  else if(act === 'comments') await toggleComments(id);
  else if(act === 'addc') await addComment(id);
  else if(act === 'share') sharePost(posts.find(p => p.id === id));
  else if(act === 'report') await reportPost(id);
  else if(act === 'delete') await deletePost(id);
  else if(act === 'refresh'){ await Promise.all([loadPosts(), loadSettings()]); show('feed'); }
  else if(act === 'publish') await publish();
  else if(act === 'boost') await toggleBoost(id);
  else if(act === 'rdismiss') await dismissReport(id);
  else if(act === 'rdelete') await reportDeletePost(id);
  else if(act === 'rban') await reportBan(id);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.dial; if(!k) return;
  const v = Number(e.target.value);
  $('#o-'+k).textContent = v;
  if(k.startsWith('boost-')) dials.boost[k.slice(6)] = v; else dials[k] = v;
  saveDials(); updateRanking();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id && e.target.id.startsWith('ci-')) addComment(e.target.id.slice(3));
  if(e.key === 'Enter' && (e.target.id === 'a-pass' || e.target.id === 'a-email')) doAuth();
});
</script>
</body>
</html>
